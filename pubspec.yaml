name: klub_connect
description: KlubConnect is a professional college club management and social networking platform.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.4
  firebase_analytics: ^11.4.4
  firebase_app_check: ^0.3.2+3
  firebase_performance: ^0.10.1+3
  firebase_remote_config: ^5.4.1

  # UI & Styling
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2
  cached_network_image: ^3.4.1

  # State Management
  provider: ^6.1.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1

  # Image Handling
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/logo_icon.png"
  adaptive_icon_background: "#F6F8FC"
  adaptive_icon_foreground: "assets/icons/logo_foreground.png"
  min_sdk_android: 21
